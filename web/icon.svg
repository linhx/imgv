<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d2b"/>
      <stop offset="50%" stop-color="#272142"/>
      <stop offset="100%" stop-color="#141624"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Foreground Photo Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a224a"/>
      <stop offset="100%" stop-color="#161528"/>
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#281e57"/>
      <stop offset="55%" stop-color="#612d76"/>
      <stop offset="100%" stop-color="#f4587c"/>
    </linearGradient>

    <!-- Sun Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <!-- Play Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Badge Drop Glow -->
    <filter id="badgeGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <clipPath id="photoClip">
      <rect x="130" y="130" width="252" height="252" rx="26" ry="26"/>
    </clipPath>
  </defs>

  <!-- Squircle Base Shadow -->
  <rect x="36" y="44" width="440" height="440" rx="96" ry="96" fill="#000000" opacity="0.45"/>

  <!-- Squircle Base Body -->
  <rect x="36" y="36" width="440" height="440" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Back Layered Card (Rotated -10 deg) -->
  <g transform="rotate(-10 256 256)">
    <rect x="120" y="110" width="272" height="272" rx="32" ry="32" fill="#312c54" opacity="0.6" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3"/>
  </g>

  <!-- Foreground Main Photo Card (Rotated +5 deg) -->
  <g transform="rotate(5 256 256)">
    <rect x="116" y="116" width="280" height="280" rx="36" ry="36" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

    <!-- Inside Picture Art -->
    <g clip-path="url(#photoClip)">
      <!-- Sunset Sky -->
      <rect x="130" y="130" width="252" height="252" fill="url(#skyGrad)"/>

      <!-- Glowing Sun -->
      <circle cx="310" cy="195" r="42" fill="url(#sunGlow)"/>

      <!-- Back Mountain -->
      <polygon points="130,382 230,230 350,382" fill="#522a7a"/>

      <!-- Front Mountain -->
      <polygon points="200,382 295,260 382,382" fill="#251a44"/>
    </g>
  </g>

  <!-- Sparkle Star in Top-Left -->
  <path d="M 110,92 Q 110,110 128,110 Q 110,110 110,128 Q 110,110 92,110 Q 110,110 110,92 Z" fill="#fde047" opacity="0.9"/>

  <!-- Glowing Play Emblem Badge (Bottom Right) -->
  <g filter="url(#badgeGlowFilter)">
    <!-- Badge Background Circle -->
    <circle cx="352" cy="352" r="54" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.8"/>

    <!-- Crisp Play Triangle Icon -->
    <polygon points="342,330 372,352 342,374" fill="#ffffff"/>
  </g>
</svg>
